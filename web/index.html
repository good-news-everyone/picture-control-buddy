<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Legacy share links (…/web/?np3=… or index.html?np3=…) open the profile editor: forwarded
     before anything renders (spec/ui-pages.md "Share links"); the editor page's own router then
     picks the desktop or the mobile page. -->
<script>
  (function () {
    if (new URLSearchParams(location.search).has("np3"))
      location.replace("picture-control-editor.html" + location.search + location.hash);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="NP3 picture control tools">NP3 picture control tools</title>
<style>
  /* The palette is a copy of web/bench.html: a neutral grey. No models, WASM or Workers here. */
  :root { --bg: #1b1b1b; --panel: #232323; --line: #333; --text: #ddd; --dim: #8a8a8a; --accent: #e6e6e6; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 24px; }
  .links { display: grid; gap: 12px; }
  .links a { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text); text-decoration: none; }
  .links a:hover, .links a:focus-visible { border-color: #6a6a6a; }
  .links b { display: block; font-size: 17px; margin-bottom: 2px; color: var(--accent); }
  .links span { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1 data-i18n="NP3 picture control tools">NP3 picture control tools</h1>
  <nav class="links">
    <a id="to-fit" href="picture-control-jpg-fit.html">
      <b data-i18n="Fit a profile to JPEGs">Fit a profile to JPEGs</b>
      <span data-i18n="RAW + JPEG pairs → an NP3 profile (desktop)">RAW + JPEG pairs → an NP3 profile (desktop)</span>
    </a>
    <a id="to-editor" href="picture-control-editor.html">
      <b data-i18n="Edit an NP3 profile">Edit an NP3 profile</b>
      <span data-i18n="Open a RAW, import, adjust and export an NP3">Open a RAW, import, adjust and export an NP3</span>
    </a>
  </nav>
</main>
<script type="module">
  import { applyI18n } from "./lib/i18n.js";
  applyI18n();
</script>
</body>
</html>
